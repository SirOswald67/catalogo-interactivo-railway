<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo Interactivo de Videojuegos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    body { background-color: #0f172a; color: #f8fafc; }
    .navbar { background-color: #1e293b; border-bottom: 1px solid #334155; }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    }
    .card-img-top {
      height: 190px;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!-- Barra de navegación responsiva -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-info" href="#">
        <i class="bi bi-controller me-2"></i>Kitsu Catalog
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <div class="ms-auto d-flex flex-column flex-lg-row gap-2 mt-2 mt-lg-0">
          <input type="search" id="buscador" class="form-control form-control-sm" placeholder="Buscar título o género..." />
          <button class="btn btn-info btn-sm text-nowrap fw-semibold" data-bs-toggle="modal" data-bs-target="#modalAgregar">
            <i class="bi bi-plus-circle me-1"></i>Agregar Juego
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Contenido principal -->
  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
      <div>
        <h1 class="h3 mb-1">Catálogo Interactivo</h1>
        <p class="text-secondary small mb-0">Conectado a MySQL en Railway con medios y enlaces en la nube</p>
      </div>
      <span class="badge bg-info text-dark" id="contador">Cargando...</span>
    </div>

    <!-- Cuadrícula responsiva -->
    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4" id="gridJuegos"></div>
  </main>

  <!-- Modal Reproductor de Tráiler (YouTube Embed) -->
  <div class="modal fade" id="modalVideo" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content bg-dark border-secondary">
        <div class="modal-header border-secondary">
          <h5 class="modal-title" id="videoTitulo">Tráiler</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body p-0">
          <div class="ratio ratio-16x9">
            <iframe id="iframeVideo" src="" title="Video en la nube" allowfullscreen></iframe>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Agregar Nuevo Registro -->
  <div class="modal fade" id="modalAgregar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark border-secondary">
        <form id="formJuego">
          <div class="modal-header border-secondary">
            <h5 class="modal-title">Registrar Nuevo Título</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-2">
              <label class="form-label small">Título</label>
              <input type="text" name="titulo" class="form-control form-control-sm" required />
            </div>
            <div class="row g-2 mb-2">
              <div class="col-6">
                <label class="form-label small">Plataforma</label>
                <input type="text" name="plataforma" class="form-control form-control-sm" placeholder="PC / PS5" required />
              </div>
              <div class="col-6">
                <label class="form-label small">Género</label>
                <input type="text" name="genero" class="form-control form-control-sm" placeholder="RPG / Acción" required />
              </div>
            </div>
            <div class="mb-2">
              <label class="form-label small">Descripción</label>
              <textarea name="descripcion" class="form-control form-control-sm" rows="2" required></textarea>
            </div>
            <div class="mb-2">
              <label class="form-label small">URL de Imagen en la Nube (Unsplash, Cloudinary, Imgur)</label>
              <input type="url" name="imagen_url" class="form-control form-control-sm" placeholder="https://..." required />
            </div>
            <div class="mb-2">
              <label class="form-label small">URL Embed de Video (YouTube Embed)</label>
              <input type="url" name="video_url" class="form-control form-control-sm" placeholder="https://www.youtube.com/embed/..." required />
            </div>
            <div class="mb-2">
              <label class="form-label small">Enlace Externo en la Nube (Drive, Steam, Web oficial)</label>
              <input type="url" name="recurso_nube_url" class="form-control form-control-sm" placeholder="https://..." required />
            </div>
          </div>
          <div class="modal-footer border-secondary">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-info btn-sm fw-semibold">Guardar en Base de Datos</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let juegosData = [];

    async function cargarJuegos() {
      const res = await fetch('/api/juegos');
      juegosData = await res.json();
      renderizar(juegosData);
    }

    function renderizar(lista) {
      const grid = document.getElementById('gridJuegos');
      const contador = document.getElementById('contador');
      contador.textContent = `${lista.length} títulos`;

      grid.innerHTML = lista.map(juego => `
        <div class="col">
          <div class="card h-100">
            <img src="${juego.imagen_url}" class="card-img-top" alt="${juego.titulo}" onerror="this.src='https://via.placeholder.com/400x200?text=Sin+Imagen'" />
            <div class="card-body d-flex flex-column">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="badge bg-secondary">${juego.plataforma}</span>
                <span class="badge bg-info text-dark">${juego.genero}</span>
              </div>
              <h5 class="card-title h6 fw-bold">${juego.titulo}</h5>
              <p class="card-text small text-secondary flex-grow-1">${juego.descripcion}</p>
              <div class="d-flex gap-2 mt-3">
                <button class="btn btn-outline-info btn-sm w-50" onclick="abrirVideo('${juego.titulo}', '${juego.video_url}')">
                  <i class="bi bi-play-circle me-1"></i>Tráiler
                </button>
                <a href="${juego.recurso_nube_url}" target="_blank" rel="noopener noreferrer" class="btn btn-outline-light btn-sm w-50">
                  <i class="bi bi-cloud-arrow-up me-1"></i>Ver Nube
                </a>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Filtro en tiempo real
    document.getElementById('buscador').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtrados = juegosData.filter(j =>
        j.titulo.toLowerCase().includes(q) ||
        j.genero.toLowerCase().includes(q) ||
        j.plataforma.toLowerCase().includes(q)
      );
      renderizar(filtrados);
    });

    // Control de Modal de Video
    const modalVideoEl = document.getElementById('modalVideo');
    const modalVideo = new bootstrap.Modal(modalVideoEl);
    function abrirVideo(titulo, url) {
      document.getElementById('videoTitulo').textContent = titulo;
      document.getElementById('iframeVideo').src = url;
      modalVideo.show();
    }
    modalVideoEl.addEventListener('hidden.bs.modal', () => {
      document.getElementById('iframeVideo').src = '';
    });

    // Enviar nuevo juego a la BD
    document.getElementById('formJuego').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = Object.fromEntries(new FormData(e.target));
      const res = await fetch('/api/juegos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(formData)
      });
      if (res.ok) {
        e.target.reset();
        bootstrap.Modal.getInstance(document.getElementById('modalAgregar')).hide();
        cargarJuegos();
      } else {
        alert('Error al guardar el registro.');
      }
    });

    cargarJuegos();
  </script>
</body>
</html>
